[msg.section_0.entries.1055]
text = [
  "An alien virus that fell to earth\\n",
  "on a meteor underwent a DNA\\n",
  "mutation to become this Pokémon.$",
]

[msg.section_0.entries.1056]
text = [
  "An alien virus that fell to earth\\n",
