  "mutation to become this Pokémon.$",
]

[msg.section_0.entries.1057]
text = [
  "An alien virus that fell to earth\\n",
  "on a meteor underwent a DNA\\n",
  "mutation to become this Pokémon.$",
]

[msg.section_0.entries.1058]
text = [
  "Even if it is born where there are\\n",
  "no cocooning materials, it somehow\\n",
  "always ends up with a cloak.$",
]

