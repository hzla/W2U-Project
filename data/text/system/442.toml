[msg.section_0.entries.1096]
text = [
  "In every direction it flies,\\n",
  "creating winds so powerful,\\n",
  "they blow everything away.$",
]

[msg.section_0.entries.1097]
text = [
  "As it flies around, it shoots lightning all\\n",
  "over the place and causes forest fires.\\n",
  "It is therefore disliked.$",
]

[msg.section_0.entries.1098]
text = [
  "From the forces of lightning and wind,\\n",
  "it creates energy to give nutrients to\\n",
  "the soil and make the land abundant.$",
]

[msg.section_0.entries.1099]
text = [
  "This legendary ice Pokémon waits for\\n",
  "a hero to fill in the missing parts\\n",
  "of its body with truth or ideals.$",
]

